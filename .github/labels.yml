# GitHub Labels Configuration for Hacktoberfest 2026
# Use with: gh label create -R lucasrafaldini/augusto --label-file .github/labels.yml

labels:
  # Hacktoberfest labels
  - name: "hacktoberfest"
    color: "F29513"
    description: "Issues suitable for Hacktoberfest 2026 participation"
  - name: "hacktoberfest-accepted"
    color: "0E8A16"
    description: "PRs accepted for Hacktoberfest 2026"

  # Difficulty labels
  - name: "good first issue"
    color: "7057FF"
    description: "Good for newcomers and first-time contributors"
  - name: "beginner"
    color: "0E8A16"
    description: "Beginner-friendly tasks"
  - name: "intermediate"
    color: "FBCA04"
    description: "Requires some experience"
  - name: "advanced"
    color: "D93F0B"
    description: "Complex tasks for experienced contributors"

  # Type labels
  - name: "enhancement"
    color: "A2EEEF"
    description: "New feature or improvement"
  - name: "bug"
    color: "D73A4A"
    description: "Something isn't working"
  - name: "documentation"
    color: "0075CA"
    description: "Improvements or additions to documentation"
  - name: "refactor"
    color: "F28E8E"
    description: "Code restructuring without behavior changes"
  - name: "test"
    color: "C2E0C6"
    description: "Adding or improving tests"

  # Area labels
  - name: "animation"
    color: "B60205"
    description: "Related to ASCII animation system"
  - name: "ascii-art"
    color: "5319E7"
    description: "Related to static ASCII art generation"
  - name: "anagram"
    color: "006B75"
    description: "Related to anagram generation"
  - name: "cli"
    color: "1D76DB"
    description: "Command-line interface changes"
  - name: "color"
    color: "E99695"
    description: "Color/ANSI support"
  - name: "export"
    color: "F9D0C4"
    description: "Export functionality (GIF, video, etc.)"
  - name: "interactive"
    color: "D4C5F9"
    description: "Interactive mode features"
  - name: "particles"
    color: "FEF2C0"
    description: "Particle system effects"
  - name: "performance"
    color: "C5DEF5"
    description: "Performance improvements or benchmarks"

  # Status labels
  - name: "help wanted"
    color: "008672"
    description: "Extra attention is needed"
  - name: "blocked"
    color: "FF9F1A"
    description: "Blocked by another issue or PR"
  - name: "wontfix"
    color: "FFFFFF"
    description: "This will not be worked on"